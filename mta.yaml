_schema-version: 3.3.0
ID: lockbox_rules_backend
description: A simple CAP project.
version: 1.0.0
modules:
- name: lockbox_rules_backend-srv
  type: nodejs
  path: gen/srv
  properties:
    CDS_CONFIG: |
      {"requires":{"db":{"credentials":{"schema":"Schema_Lockbox_Rules"}}}}
    NODE_ENV: production
  requires:
  - name: lockbox_rules_backend-auth
  - name: PostgresqlQAS
  - name: lockbox_rules_backend-destination-service
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: lockbox_rules_backend-postgres-deployer
  type: nodejs
  path: gen/pg
  properties:
    CDS_CONFIG: |
      {"requires":{"db":{"credentials":{"schema":"Schema_Lockbox_Rules"}}}}
  requires:
  - name: PostgresqlQAS
  
  parameters:
    buildpack: nodejs_buildpack
    disk-quota: 1G
    memory: 256M
    no-route: true
    no-start: true
    tasks:
    - command: npm start
      disk-quota: 1G
      memory: 256M
      name: deploy-to-postgresql
  build-parameters:
    ignore:
    - node_modules/
- name: lockbox_rules_backend-destination-content
  type: com.sap.application.content
  requires:
  - name: lockbox_rules_backend-destination-service
    parameters:
      content-target: true
  - name: lockbox_rules_backend-repo-host
    parameters:
      service-key:
        name: lockbox_rules_backend-repo-host-key
  - name: lockbox_rules_backend-auth
    parameters:
      service-key:
        name: lockbox_rules_backend-auth-key
  parameters:
    content:
      instance:
        destinations:
        - Name: lockbox_rules_backend_html_repo_host
          ServiceInstanceName: lockbox_rules_backend-html5-service
          ServiceKeyName: lockbox_rules_backend-repo-host-key
          sap.cloud.service: lockrules
        - Authentication: OAuth2UserTokenExchange
          Name: lockbox_rules_backend_auth
          ServiceInstanceName: lockbox_rules_backend-auth
          ServiceKeyName: lockbox_rules_backend-auth-key
          sap.cloud.service: lockrules
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: lockbox_rules_backend-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: lockbox_rules_backend-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - lockrules.zip
      name: lockrules
      target-path: resources/
    - artifacts:
      - configuration.zip
      name: configuration
      target-path: resources/
    - artifacts:
      - lockboxreasoncode.zip
      name: lockboxreasoncode
      target-path: resources/
- name: lockrules
  type: html5
  path: app/lockrules
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: configuration
  type: html5
  path: app/configuration
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: lockboxreasoncode
  type: html5
  path: app/lockbox_reasoncode
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: PostgresqlQAS
  type: org.cloudfoundry.existing-service
  parameters:
    service-name: PostgresqlQAS
- name: lockbox_rules_backend-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: lockbox_rules_backend-html5-service
    service-plan: app-host
- name: lockbox_rules_backend-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestinations: true
            HTML5.ForwardAuthToken: true
            Name: managedrouter
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: lockbox_rules_backend-destination-service
    service-plan: lite
  requires:
  - name: srv-api
- name: lockbox_rules_backend-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: lockbox_rules_backend-XSUAA
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
    - cp pg-package.json gen/pg/package.json
